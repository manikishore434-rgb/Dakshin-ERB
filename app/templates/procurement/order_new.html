{% extends 'base.html' %}
{% block title %}New Purchase Order - SNACKFLOW ERP{% endblock %}

{% block body %}
<div class="page-header">
  <div class="page-title-group">
    <h1>Create Purchase Order</h1>
    <div class="page-subtitle">Order raw materials and packaging from verified suppliers.</div>
  </div>
</div>

<div class="card" style="max-width:850px; margin:auto;">
  <form method="post" action="{{ url_for('procurement.purchase_order_new') }}">
    <div class="form-grid-3">
      <div class="form-group">
        <label for="supplier_id">Select Supplier</label>
        <select name="supplier_id" id="supplier_id" required>
          {% for s in suppliers %}
          <option value="{{ s.id }}">{{ s.name }} (Lead time: {{ s.lead_time_days }} days)</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="order_date">Order Date</label>
        <input type="date" name="order_date" id="order_date" value="{{ today() }}" required>
      </div>

      <div class="form-group">
        <label for="expected_delivery">Expected Delivery Date</label>
        <input type="date" name="expected_delivery" id="expected_delivery">
      </div>
    </div>

    <div style="font-weight:700; font-size:0.95rem; margin:1.25rem 0 0.5rem; color:var(--text-main);">
      Order Items (Up to 5 Lines)
    </div>

    {% for i in range(1, 6) %}
    <div class="form-grid-3" style="margin-bottom:0.6rem; align-items:flex-end;">
      <div class="form-group" style="margin-bottom:0;">
        <label style="font-size:0.75rem;">Item {{ i }}</label>
        <select name="item_{{ i }}" id="item_{{ i }}">
          <option value="">-- Select Material / Packaging --</option>
          {% for it in items %}
          <option value="{{ it.id }}">{{ it.name }} ({{ it.code }}) [{{ it.base_unit }}]</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label style="font-size:0.75rem;">Quantity</label>
        <input type="number" step="any" name="qty_{{ i }}" placeholder="e.g. 50">
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label style="font-size:0.75rem;">Agreed Rate (₹/unit)</label>
        <input type="number" step="any" name="rate_{{ i }}" placeholder="e.g. 45.00">
      </div>
    </div>
    {% endfor %}

    <div class="form-group" style="margin-top:1.25rem;">
      <label for="notes">Purchase Notes / Delivery Terms</label>
      <textarea name="notes" id="notes" rows="2" placeholder="Standard payment 30 days; quality inspection on delivery..."></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
      <a href="{{ url_for('procurement.purchase_orders') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Purchase Order (Draft) →</button>
    </div>
  </form>
</div>
{% endblock %}
