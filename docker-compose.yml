services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-snackflow-secret-key-change-in-production}
      DATABASE: /srv/data/oto.db
      PORT: 5000
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
